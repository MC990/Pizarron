<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    touch-action: none;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fff;
    font-family: sans-serif;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    margin: 8px 0;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    box-sizing: border-box;
    padding: 0 8px;
  }
  .toolbar button {
    padding: 6px 10px;
    border: 1px solid #ccc;
    background: #f5f5f5;
    cursor: pointer;
    border-radius: 4px;
  }
  .toolbar button.active { background: #333; color: #fff; }
  canvas {
    border: 1px solid #ccc;
    cursor: crosshair;
    touch-action: none;
    max-width: 100%;
    max-height: calc(100vh - 60px);
  }
</style>
</head>
<body>

<div class="toolbar">
  <input type="color" value="#000000">
  <input type="range" min="1" max="20" value="3" id="size">
  <button id="eraser">Borrador</button>
  <button id="clear">Borrar todo</button>
</div>

<canvas id="c"></canvas>

<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
const colorInput = document.querySelector('input[type="color"]');
const sizeInput = document.getElementById('size');
let drawing = false;
let erasing = false;

function resizeCanvas() {
  const w = Math.min(window.innerWidth, 480);
  const h = Math.min(window.innerHeight - 60, 360);
  c.width = w;
  c.height = h;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

x.lineWidth = 3;
x.lineCap = 'round';
x.lineJoin = 'round';

function getPos(e) {
  const rect = c.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length > 0) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: (clientX - rect.left) * (c.width / rect.width),
    y: (clientY - rect.top) * (c.height / rect.height)
  };
}

function startDraw(e) {
  drawing = true;
  const pos = getPos(e);
  x.beginPath();
  x.moveTo(pos.x, pos.y);
  if (e.cancelable) e.preventDefault();
}

function moveDraw(e) {
  if (!drawing) return;
  const pos = getPos(e);
  x.strokeStyle = erasing ? '#ffffff' : colorInput.value;
  x.lineWidth = erasing ? 20 : parseInt(sizeInput.value);
  x.lineTo(pos.x, pos.y);
  x.stroke();
  if (e.cancelable) e.preventDefault();
}

function stopDraw() {
  drawing = false;
}

c.addEventListener('mousedown', startDraw);
c.addEventListener('mousemove', moveDraw);
c.addEventListener('mouseup', stopDraw);
c.addEventListener('mouseleave', stopDraw);

c.addEventListener('touchstart', startDraw, { passive: false });
c.addEventListener('touchmove', moveDraw, { passive: false });
c.addEventListener('touchend', stopDraw);

document.getElementById('eraser').onclick = function() {
  erasing = !erasing;
  this.classList.toggle('active');
};
document.getElementById('clear').onclick = () => {
  x.clearRect(0, 0, c.width, c.height);
};
</script>

</body>
