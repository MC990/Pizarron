<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #fff; font-family: sans-serif; }
  .toolbar { display: flex; gap: 10px; margin: 10px 0; align-items: center; }
  .toolbar button { padding: 6px 12px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; border-radius: 4px; }
  .toolbar button.active { background: #333; color: #fff; }
  canvas { border: 1px solid #ccc; cursor: crosshair; }
</style>
</head>
<body>

<div class="toolbar">
  <input type="color" value="#000000">
  <input type="range" min="1" max="20" value="3" id="size">
  <button id="eraser">Borrador</button>
  <button id="clear">Borrar todo</button>
</div>

<canvas id="c" width="480" height="360"></canvas>

<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
const colorInput = document.querySelector('input[type="color"]');
const sizeInput = document.getElementById('size');
let drawing = false;
let erasing = false;

x.lineWidth = 3;
x.lineCap = 'round';
x.lineJoin = 'round';

c.onmousedown = e => {
  drawing = true;
  x.beginPath();
  x.moveTo(e.offsetX, e.offsetY);
};
c.onmousemove = e => {
  if (!drawing) return;
  x.strokeStyle = erasing ? '#ffffff' : colorInput.value;
  x.lineWidth = erasing ? 20 : sizeInput.value;
  x.lineTo(e.offsetX, e.offsetY);
  x.stroke();
};
c.onmouseup = () => drawing = false;
c.onmouseleave = () => drawing = false;

document.getElementById('eraser').onclick = function() {
  erasing = !erasing;
  this.classList.toggle('active');
};
document.getElementById('clear').onclick = () => {
  x.clearRect(0, 0, c.width, c.height);
};
</script>

</body>
</html>
