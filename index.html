<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #fff; font-family: sans-serif; touch-action: none; }
  .toolbar { display: flex; gap: 10px; margin: 10px 0; align-items: center; }
  .toolbar button { padding: 6px 12px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; border-radius: 4px; }
  .toolbar button.active { background: #333; color: #fff; }
  canvas { border: 1px solid #ccc; cursor: crosshair; touch-action: none; }
</style>
</head>
<body>

<div class="toolbar">
  <input type="color" value="#000000">
  <input type="range" min="1" max="20" value="3" id="size">
  <button id="eraser">Borrador</button>
  <button id="clear">Borrar todo</button>
</div>

<canvas id="c" width="480" height="360"></canvas>

<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
const colorInput = document.querySelector('input[type="color"]');
const sizeInput = document.getElementById('size');
let drawing = false;
let erasing = false;

x.lineWidth = 3;
x.lineCap = 'round';
x.lineJoin = 'round';

function getPos(e) {
  const rect = c.getBoundingClientRect();
  if (e.touches) {
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }
  return { x: e.offsetX, y: e.offsetY };
}

function startDraw(e) {
  drawing = true;
  const pos = getPos(e);
  x.beginPath();
  x.moveTo(pos.x, pos.y);
  e.preventDefault();
}

function moveDraw(e) {
  if (!drawing) return;
  const pos = getPos(e);
  x.strokeStyle = erasing ? '#ffffff' : colorInput.value;
  x.lineWidth = erasing ? 20 : sizeInput.value;
  x.lineTo(pos.x, pos.y);
  x.stroke();
  e.preventDefault();
}

function stopDraw() {
  drawing = false;
}

// Mouse
c.addEventListener('mousedown', startDraw);
c.addEventListener('mousemove', moveDraw);
c.addEventListener('mouseup', stopDraw);
c.addEventListener('mouseleave', stopDraw);

// Touch (celular)
c.addEventListener('touchstart', startDraw, { passive: false });
c.addEventListener('touchmove', moveDraw, { passive: false });
c.addEventListener('touchend', stopDraw);

// Botones
document.getElementById('eraser').onclick = function() {
  erasing = !erasing;
  this.classList.toggle('active');
};
document.getElementById('clear').onclick = () => {
  x.clearRect(0, 0, c.width, c.height);
};
</script>

</body>
</html>
